# Local stack: Mongo, a one-off seed of the labeled table, then the app on http://localhost:4111.
#   docker compose up --build
x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    MONGODB_URI: mongodb://mongo:27017
    MONGODB_DB: shinobi

services:
  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: [mongo:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Pulls OpenAlex and NSF data for the 76 labeled professors, which TabPFN learns from.
  # Takes a couple of minutes the first time and is skipped once the table is full.
  seed:
    <<: *app
    command: ["npm", "run", "features"]
    depends_on:
      mongo:
        condition: service_healthy

  app:
    <<: *app
    ports: ["4111:4111"]
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  mongo:
