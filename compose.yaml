# Local stack: Mongo, then the app on http://localhost:4111.
#   docker compose up --build
x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    MONGODB_URI: mongodb://mongo:27017
    MONGODB_DB: shinobi

services:
  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: [mongo:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    <<: *app
    ports: ["4111:4111"]
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo:
