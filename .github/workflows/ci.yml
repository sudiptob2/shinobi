# Checks only. Render watches main and deploys a commit once these checks pass (its auto-deploy is set to "after CI checks pass").
name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore: *docs

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run typecheck
      - run: npm test
        env:
          SESSION_SECRET: ci
      - run: npm run lint --prefix web
      - run: npm run build --prefix web
      - run: docker build -t shinobi .
